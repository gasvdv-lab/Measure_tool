<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#111111" />
  <title>Measure AR v0.6.6</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      color: #fff;
    }
    #app {
      position: fixed;
      inset: 0;
      overflow-y: auto;
      padding: 24px 0;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 35%, rgba(255,255,255,.05), transparent 45%), #111;
    }
    .panel {
      width: min(92vw, 560px);
      padding: 24px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 22px;
      background: rgba(25,25,25,.94);
    }
    h1 { margin: 0 0 8px; font-size: 1.7rem; text-align:center; }
    p { margin: 8px 0; color: #d0d0d0; line-height: 1.45; }
    .modes {
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:10px;
      margin:18px 0;
    }
    .modeBtn, .dirBtn {
      background:#242424;
      color:#fff;
      border:1px solid rgba(255,255,255,.15);
    }
    .modeBtn.active, .dirBtn.active {
      background:#fff;
      color:#111;
    }
    .stakeSettings {
      display:none;
      margin: 14px 0 4px;
      padding:14px;
      border-radius:16px;
      background:#1c1c1c;
      border:1px solid rgba(255,255,255,.10);
    }
    .row {
      display:grid;
      grid-template-columns: 1fr 120px;
      gap:10px;
      align-items:end;
    }
    .dirGrid {
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap:8px;
      margin-top:10px;
    }
    label {
      display:block;
      color:#ddd;
      font-size:.9rem;
      margin-bottom:6px;
    }
    input, select {
      width:100%;
      min-height:48px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.18);
      background:#101010;
      color:#fff;
      padding:10px 12px;
      font:inherit;
    }
    button {
      appearance:none;
      border:0;
      border-radius:14px;
      padding:14px 18px;
      min-height:52px;
      font:inherit;
      font-weight:700;
      cursor:pointer;
    }

    .launcher { text-align:center; }
    .launcherIntro { max-width:36ch; margin:8px auto 18px; }
    .brandMark { position:relative; width:160px; height:58px; margin:0 auto 16px; }
    .brandMeasure { position:absolute; left:35px; right:35px; top:28px; height:3px; background:#fff; border-radius:2px; }
    .brandPoint { position:absolute; top:20px; width:19px; height:19px; border-radius:50%; border:3px solid #fff; background:#111; }
    .brandPoint.left { left:18px; } .brandPoint.right { right:18px; }
    .brandCross { position:absolute; left:50%; top:0; transform:translateX(-50%); font-size:36px; }
    .secondaryStart { width:100%; margin-top:10px; background:#252525; color:#fff; border:1px solid rgba(255,255,255,.15); }
    .settingsPanel { display:none; margin-top:16px; padding:14px; border-radius:16px; background:#191919; border:1px solid rgba(255,255,255,.10); text-align:left; }
    .settingsPanel.open { display:block; }
    .settingsGrid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .settingCheck { display:flex; align-items:center; gap:9px; margin-top:12px; font-size:.9rem; color:#ddd; }
    .settingCheck input { width:auto; min-height:0; }

    .lineEditor { display:none; margin-top:9px; padding-top:8px; border-top:1px solid rgba(255,255,255,.12); }
    .lineEditor.open { display:block; }
    .lineEditorTitle { font-size:.78rem; font-weight:700; margin-bottom:4px; }

    #startBtn {
      margin-top:18px;
      width:100%;
      background:#fff;
      color:#111;
    }
    #startBtn:disabled { opacity:.45; cursor:default; }

    #overlay {
      position:fixed;
      inset:0;
      z-index:10;
      pointer-events:none;
      display:none;
    }
    #topbar {
      position:absolute;
      top:max(14px, env(safe-area-inset-top));
      left:14px;
      right:14px;
      display:flex;
      gap:10px;
      align-items:stretch;
    }
    .statusbox {
      flex:1;
      border-radius:16px;
      padding:11px 14px;
      background:rgba(0,0,0,.64);
      backdrop-filter:blur(8px);
    }
    #stage {
      font-size:.82rem;
      color:#cfcfcf;
      margin-bottom:2px;
    }
    #distance {
      font-size:1.45rem;
      font-weight:800;
      letter-spacing:.01em;
    }
    #detail {
      margin-top:2px;
      font-size:.88rem;
      color:#ddd;
    }
    #stability {
      display:inline-block;
      margin-top:6px;
      padding:4px 8px;
      border-radius:999px;
      font-size:.78rem;
      background:rgba(255,255,255,.12);
      color:#fff;
    }
    #stability.good { background:rgba(64,190,110,.28); }
    #stability.medium { background:rgba(220,170,40,.28); }
    #stability.poor { background:rgba(210,70,70,.28); }
    #cameraMenuBtn {
      pointer-events:auto;
      width:54px;
      min-width:54px;
      height:54px;
      min-height:54px;
      padding:0;
      border-radius:16px;
      background:rgba(0,0,0,.70);
      color:#fff;
      border:1px solid rgba(255,255,255,.22);
      font-size:1.55rem;
      line-height:1;
    }

    #cameraMenuPanel {
      position:absolute;
      top:calc(max(14px, env(safe-area-inset-top)) + 66px);
      right:14px;
      width:min(84vw, 320px);
      padding:14px;
      border-radius:18px;
      background:rgba(10,10,10,.92);
      border:1px solid rgba(255,255,255,.16);
      backdrop-filter:blur(10px);
      pointer-events:auto;
      display:none;
    }
    #cameraMenuPanel.open { display:block; }
    #cameraMenuPanel h3 {
      margin:0 0 10px;
      font-size:1rem;
      font-weight:700;
    }
    #cameraMenuPanel .menuStatus {
      margin:0 0 12px;
      font-size:.88rem;
      color:#ccc;
    }
    #cameraMenuPanel button {
      width:100%;
      margin-top:8px;
      background:rgba(255,255,255,.92);
      color:#111;
    }
    #cameraMenuPanel .secondary {
      background:rgba(255,255,255,.12);
      color:#fff;
      border:1px solid rgba(255,255,255,.16);
    }
    #cameraMenuPanel .menuField {
      margin-top:10px;
    }
    #cameraMenuPanel .menuField label {
      display:block;
      margin-bottom:5px;
      font-size:.78rem;
      color:#bbb;
    }
    #cameraMenuPanel input,
    #cameraMenuPanel select {
      width:100%;
      min-height:44px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,.16);
      background:rgba(255,255,255,.10);
      color:#fff;
      padding:9px 10px;
      font:inherit;
    }
    #cameraMenuPanel select option { color:#111; }
    #menuObjects {
      display:none;
      max-height:230px;
      overflow:auto;
      margin-top:10px;
      padding-top:6px;
      border-top:1px solid rgba(255,255,255,.12);
    }
    #menuObjects.open { display:block; }
    .menuObjectRow {
      display:grid;
      grid-template-columns:1fr auto;
      gap:8px;
      align-items:center;
      padding:7px 0;
      font-size:.86rem;
    }
    .menuObjectRow button {
      width:auto !important;
      min-height:34px !important;
      margin:0 !important;
      padding:6px 9px !important;
    }
    #geometryPanel {
      display:none !important;
      position:absolute;
      left:14px;
      right:14px;
      bottom:max(176px, calc(env(safe-area-inset-bottom) + 176px));
      padding:10px 12px;
      border-radius:16px;
      background:rgba(0,0,0,.58);
      backdrop-filter:blur(8px);
      pointer-events:none;
      display:none;
    }
    #geometryPanel.visible { display:block; }
    #geometrySummary {
      font-size:.88rem;
      color:#eee;
      text-align:center;
    }
    #geometryList {
      max-height:220px;
      overflow-y:auto;
      margin-top:10px;
      display:none;
      pointer-events:auto;
    }
    #geometryList.open { display:block; }
    .geomRow {
      display:grid;
      grid-template-columns: 1fr auto;
      gap:8px;
      align-items:center;
      padding:8px 0;
      border-top:1px solid rgba(255,255,255,.10);
      font-size:.9rem;
    }
    .geomRow:first-child { border-top:0; }
    .geomRow button {
      min-height:38px;
      padding:8px 10px;
      border-radius:10px;
      background:rgba(255,255,255,.12);
      color:#fff;
      border:1px solid rgba(255,255,255,.14);
      pointer-events:auto;
    }
    #toggleGeometryListBtn {
      width:100%;
      min-height:40px;
      margin-top:8px;
      padding:8px 12px;
      border-radius:10px;
      background:rgba(255,255,255,.10);
      color:#fff;
      border:1px solid rgba(255,255,255,.14);
      pointer-events:auto;
    }
    #aim {
      position:absolute;
      left:50%;
      top:50%;
      width:54px;
      height:54px;
      transform:translate(-50%,-50%);
      opacity:.92;
    }
    #aim::before, #aim::after {
      content:"";
      position:absolute;
      background:rgba(255,255,255,.95);
      border-radius:2px;
    }
    #aim::before { width:26px; height:2px; left:14px; top:26px; }
    #aim::after { width:2px; height:26px; left:26px; top:14px; }
    #aim.ready::before, #aim.ready::after { background:#69ff9a; }
    #aim.virtual::before, #aim.virtual::after { background:#ffd166; }

    #captureWrap {
      position:absolute;
      left:50%;
      bottom:max(86px, calc(env(safe-area-inset-bottom) + 86px));
      transform:translateX(-50%);
      display:flex;
      align-items:center;
      justify-content:center;
      pointer-events:auto;
    }
    #captureBtn {
      width:84px;
      height:84px;
      min-height:0;
      padding:0;
      border-radius:50%;
      border:5px solid rgba(255,255,255,.98);
      background:rgba(255,255,255,.18);
      box-shadow:0 0 0 4px rgba(0,0,0,.28);
      position:relative;
    }
    #captureBtn::after {
      content:"";
      position:absolute;
      inset:8px;
      border-radius:50%;
      background:rgba(255,255,255,.98);
      transition:transform .08s ease, opacity .08s ease;
    }
    #captureBtn:active::after { transform:scale(.9); opacity:.8; }
    #captureBtn:disabled { opacity:.35; cursor:default; }

    #hint {
      position:absolute;
      left:50%;
      bottom:max(20px, env(safe-area-inset-bottom));
      transform:translateX(-50%);
      width:min(90vw, 560px);
      text-align:center;
      padding:10px 14px;
      border-radius:14px;
      background:rgba(0,0,0,.62);
      color:#eee;
      font-size:.95rem;
      backdrop-filter:blur(8px);
    }
    #error {
      margin-top:14px;
      padding:12px;
      border-radius:12px;
      background:#341818;
      color:#ffd1d1;
      display:none;
      white-space:pre-wrap;
    }
    canvas { position:fixed; inset:0; width:100%; height:100%; }
  </style>
</head>
<body>
  <div id="app">
    <div class="panel launcher">
      <div class="brandMark" aria-hidden="true">
        <span class="brandPoint left"></span><span class="brandMeasure"></span><span class="brandPoint right"></span>
        <span class="brandCross">＋</span>
      </div>
      <h1>Measure AR</h1>
      <p class="launcherIntro">AR meten, uitzetten en geometrie bouwen in de echte wereld.</p>
      <button id="startBtn" type="button">Start AR</button>
      <button id="settingsBtn" class="secondaryStart" type="button">Instellingen</button>
      <div id="settingsPanel" class="settingsPanel">
        <div class="settingsGrid">
          <div><label for="defaultUnit">Eenheid</label><select id="defaultUnit"><option value="m">meter</option><option value="cm">centimeter</option></select></div>
          <div><label for="defaultThickness">Lijndikte</label><select id="defaultThickness"><option value="1">1 · fijn</option><option value="2" selected>2 · normaal</option><option value="3">3 · duidelijk</option><option value="4">4 · zwaar</option></select></div>
        </div>
        <label class="settingCheck"><input id="defaultLabels" type="checkbox" checked> Labels op lijnen</label>
      </div>
      <div id="error"></div>
    </div>
  </div>

  <div id="overlay">
    <div id="topbar">
      <div class="statusbox">
        <div id="stage">Zoek een oppervlak</div>
        <div id="distance">—</div>
        <div id="detail"></div>
        <div id="stability">Stabiliteit: —</div>
      </div>
      <button id="cameraMenuBtn" type="button" aria-label="Cameramenu openen">☰</button>
    </div>

    <div id="cameraMenuPanel" aria-hidden="true">
      <h3>AR-menu</h3>
      <div id="cameraModeLabel" class="menuStatus">Modus: Meten</div>
      <button id="menuModeMeasureBtn" type="button">Meten</button>
      <button id="menuModeStakeBtn" class="secondary" type="button">Uitzetten</button>

      <div class="menuField"><label for="menuDistanceInput">Afstand</label><input id="menuDistanceInput" type="number" inputmode="decimal" min="0.01" step="0.01" value="2.00"></div>
      <div class="menuField"><label for="menuUnitSelect">Eenheid</label><select id="menuUnitSelect"><option value="m">m</option><option value="cm">cm</option></select></div>
      <div class="menuField"><label for="menuDirectionSelect">Richting</label><select id="menuDirectionSelect"><option value="horizontal">Horizontaal</option><option value="surface">Op oppervlak</option><option value="free3d">Vrij 3D</option></select></div>

      <button id="menuNewLineBtn" class="secondary" type="button">Nieuwe lijn</button>
      <button id="menuUseLastPointBtn" class="secondary" type="button">Vanaf laatste punt</button>
      <button id="menuStakeFromLastBtn" type="button">Afstand uitzetten vanaf laatste punt</button>

      <button id="menuObjectsBtn" class="secondary" type="button">Objecten</button>
      <div id="menuObjects"></div>

      <div id="lineEditor" class="lineEditor">
        <div class="lineEditorTitle">Actieve lijn</div>
        <div id="lineEditorName" class="menuStatus">—</div>
        <div class="menuField"><label for="lineLengthInput">Lengte</label><input id="lineLengthInput" type="number" inputmode="decimal" min="0.01" step="0.01"></div>
        <div class="menuField"><label for="lineThicknessSelect">Dikte</label><select id="lineThicknessSelect"><option value="1">1 · fijn</option><option value="2">2 · normaal</option><option value="3">3 · duidelijk</option><option value="4">4 · zwaar</option></select></div>
        <button id="applyLineLengthBtn" type="button">Lengte aanpassen vanaf startpunt</button>
      </div>

      <button id="undoBtn" class="secondary" type="button">Ongedaan maken</button>
      <button id="menuClearAllBtn" class="secondary" type="button">Alles wissen</button>
      <button id="menuBackBtn" class="secondary" type="button">Terug naar start</button>
      <button id="menuCloseBtn" class="secondary" type="button">Sluiten</button>
    </div>

    <div id="aim"></div>

    <div id="geometryPanel">
      <div id="geometrySummary">0 punten · 0 lijnen</div>
      <button id="toggleGeometryListBtn" type="button">Objecten tonen</button>
      <div id="geometryList"></div>
    </div>

    <div id="captureWrap">
      <button id="captureBtn" type="button" aria-label="Punt vastleggen" disabled></button>
    </div>

    <div id="hint">Beweeg rustig zodat ARCore het oppervlak kan herkennen.</div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.module.js';
    import { Line2 } from 'https://cdn.jsdelivr.net/npm/three@0.167.1/examples/jsm/lines/Line2.js/+esm';
    import { LineMaterial } from 'https://cdn.jsdelivr.net/npm/three@0.167.1/examples/jsm/lines/LineMaterial.js/+esm';
    import { LineGeometry } from 'https://cdn.jsdelivr.net/npm/three@0.167.1/examples/jsm/lines/LineGeometry.js/+esm';

    const startBtn = document.getElementById('startBtn');
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsPanel = document.getElementById('settingsPanel');
    const defaultUnit = document.getElementById('defaultUnit');
    const defaultThickness = document.getElementById('defaultThickness');
    const defaultLabels = document.getElementById('defaultLabels');
    const cameraMenuBtn = document.getElementById('cameraMenuBtn');
    const cameraMenuPanel = document.getElementById('cameraMenuPanel');
    const cameraModeLabel = document.getElementById('cameraModeLabel');
    const menuModeMeasureBtn = document.getElementById('menuModeMeasureBtn');
    const menuModeStakeBtn = document.getElementById('menuModeStakeBtn');
    const menuNewLineBtn = document.getElementById('menuNewLineBtn');
    const menuUseLastPointBtn = document.getElementById('menuUseLastPointBtn');
    const menuClearAllBtn = document.getElementById('menuClearAllBtn');
    const menuDistanceInput = document.getElementById('menuDistanceInput');
    const menuUnitSelect = document.getElementById('menuUnitSelect');
    const menuDirectionSelect = document.getElementById('menuDirectionSelect');
    const menuStakeFromLastBtn = document.getElementById('menuStakeFromLastBtn');
    const menuObjectsBtn = document.getElementById('menuObjectsBtn');
    const menuObjects = document.getElementById('menuObjects');
    const lineEditor = document.getElementById('lineEditor');
    const lineEditorName = document.getElementById('lineEditorName');
    const lineLengthInput = document.getElementById('lineLengthInput');
    const lineThicknessSelect = document.getElementById('lineThicknessSelect');
    const applyLineLengthBtn = document.getElementById('applyLineLengthBtn');
    const undoBtn = document.getElementById('undoBtn');
    const menuBackBtn = document.getElementById('menuBackBtn');
    const menuCloseBtn = document.getElementById('menuCloseBtn');
    const captureBtn = document.getElementById('captureBtn');
    const app = document.getElementById('app');
    const overlay = document.getElementById('overlay');
    const errorBox = document.getElementById('error');
    const stageEl = document.getElementById('stage');
    const distanceEl = document.getElementById('distance');
    const detailEl = document.getElementById('detail');
    const stabilityEl = document.getElementById('stability');
    const hintEl = document.getElementById('hint');
    const aimEl = document.getElementById('aim');
    const geometryPanel = document.getElementById('geometryPanel');
    const geometrySummary = document.getElementById('geometrySummary');
    const geometryList = document.getElementById('geometryList');
    const toggleGeometryListBtn = document.getElementById('toggleGeometryListBtn');

    let mode = 'measure';
    let directionMode = 'horizontal';
    let targetMeters = 2.0;

    let renderer, scene, camera, reticle;
    let hitTestSource = null;
    let hitTestSourceRequested = false;
    let xrSession = null;

    // Huidige actieve lijn
    let pointA = null;
    let pointB = null;
    let directionPoint = null;
    let normalAtA = null;

    let markerA = null;
    let markerB = null;
    let directionMarker = null;
    let measureLine = null;

    // Permanente geometrie binnen de huidige AR-sessie
    const points = [];
    const lines = [];
    const undoStack = [];
    let selectedLineId = null;
    let nextPointIndex = 0;
    let nextLineIndex = 1;
    let activeStartPointId = null;

    const tmpPos = new THREE.Vector3();
    const tmpQuat = new THREE.Quaternion();
    const upAxis = new THREE.Vector3(0, 1, 0);
    const cameraPos = new THREE.Vector3();
    const cameraQuat = new THREE.Quaternion();
    const cameraForward = new THREE.Vector3();
    const MAX_VIRTUAL_RANGE = 40;

    let targetSource = 'none';
    let currentTargetPoint = null;

    // Stabiliteitsfilter: we bewaren een korte geschiedenis van richtpunten.
    const sampleHistory = [];
    const MAX_SAMPLES = 18;
    const MIN_CAPTURE_SAMPLES = 6;
    let stabilityMeters = null;
    let stabilityClass = 'unknown';


    function updateCameraMenuLabel() {
      if (!cameraModeLabel) return;
      cameraModeLabel.textContent =
        `${mode === 'measure' ? 'Modus: Meten' : 'Modus: Uitzetten'} · ${points.length}p · ${lines.length}l`;
    }

    function openCameraMenu() {
      const unit = defaultUnit.value || 'm';
      menuUnitSelect.value = unit;
      menuDistanceInput.value = unit === 'cm'
        ? (targetMeters * 100).toFixed(1)
        : targetMeters.toFixed(2);
      menuDirectionSelect.value = directionMode;
      cameraMenuPanel.classList.add('open');
      cameraMenuPanel.setAttribute('aria-hidden', 'false');
      updateCameraMenuLabel();
    }

    function closeCameraMenu() {
      cameraMenuPanel.classList.remove('open');
      cameraMenuPanel.setAttribute('aria-hidden', 'true');
    }

    async function switchFunctionFromAR() {
      const nextMode = mode === 'measure' ? 'stake' : 'measure';
      setMode(nextMode);
      closeCameraMenu();
      await exitAR();


    }

    function setMode(nextMode) {
      mode = nextMode;
      updateCameraMenuLabel();
    }

    function setDirectionMode(nextMode) {
      directionMode = nextMode;
      if (menuDirectionSelect) menuDirectionSelect.value = nextMode;
    }

    function readTargetMeters() {
      const value = Number(menuDistanceInput?.value);
      if (!Number.isFinite(value) || value <= 0) return null;
      return menuUnitSelect?.value === 'cm' ? value / 100 : value;
    }

    function showError(message) {
      errorBox.style.display = 'block';
      errorBox.textContent = message;
    }

    function formatDistance(meters) {
      if (meters < 1) return `${(meters * 100).toFixed(1)} cm`;
      if (meters < 10) return `${meters.toFixed(3)} m`;
      return `${meters.toFixed(2)} m`;
    }



    function pointNameFromIndex(index) {
      // A..Z, daarna A1..Z1
      const letter = String.fromCharCode(65 + (index % 26));
      const cycle = Math.floor(index / 26);
      return cycle === 0 ? letter : `${letter}${cycle}`;
    }

    function getPointById(id) {
      return points.find(p => p.id === id) || null;
    }

    function createPermanentPoint(position, color = 0x69ff9a) {
      const id = `p${Date.now()}_${Math.random().toString(36).slice(2,7)}`;
      const name = pointNameFromIndex(nextPointIndex++);
      const marker = makeMarker(color, 1);
      marker.position.copy(position);

      const point = {
        id,
        name,
        position: position.clone(),
        marker
      };

      points.push(point);
      updateGeometryUI();
      return point;
    }

    function makeTextSprite(text) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = 512 * dpr;
      canvas.height = 128 * dpr;
      ctx.scale(dpr, dpr);

      ctx.font = '700 34px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      const metrics = ctx.measureText(text);
      const boxW = Math.min(490, Math.max(190, metrics.width + 54));
      const x = 256;
      const y = 64;

      ctx.fillStyle = 'rgba(0,0,0,.76)';
      ctx.beginPath();
      const left = x - boxW/2, top = 18, right = x + boxW/2, bottom = 110, r = 18;
      ctx.moveTo(left+r, top);
      ctx.lineTo(right-r, top);
      ctx.quadraticCurveTo(right, top, right, top+r);
      ctx.lineTo(right, bottom-r);
      ctx.quadraticCurveTo(right, bottom, right-r, bottom);
      ctx.lineTo(left+r, bottom);
      ctx.quadraticCurveTo(left, bottom, left, bottom-r);
      ctx.lineTo(left, top+r);
      ctx.quadraticCurveTo(left, top, left+r, top);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.fillText(text, x, y);

      const texture = new THREE.CanvasTexture(canvas);
      texture.minFilter = THREE.LinearFilter;
      const material = new THREE.SpriteMaterial({
        map: texture,
        transparent: true,
        depthTest: false
      });
      const sprite = new THREE.Sprite(material);
      sprite.userData.labelTexture = texture;
      sprite.userData.baseScale = new THREE.Vector3(0.72, 0.18, 1);
      sprite.scale.copy(sprite.userData.baseScale);
      return sprite;
    }

    function thicknessToPixels(level) {
      return ({1:2, 2:4, 3:6, 4:8})[level] || 4;
    }

    function makeTechnicalLine(start, end, thickness = 2, color = 0xffffff) {
      const geometry = new LineGeometry();
      geometry.setPositions([start.x,start.y,start.z,end.x,end.y,end.z]);

      const material = new LineMaterial({
        color,
        linewidth: thicknessToPixels(thickness),
        worldUnits: false,
        transparent: true,
        opacity: .98
      });
      material.resolution.set(window.innerWidth, window.innerHeight);

      const line = new Line2(geometry, material);
      line.computeLineDistances();
      scene.add(line);
      return line;
    }

    function refreshLineGeometry(line) {
      const start = getPointById(line.startId);
      const end = getPointById(line.endId);
      if (!start || !end) return;

      line.distance = start.position.distanceTo(end.position);
      line.object.geometry.setPositions([
        start.position.x,start.position.y,start.position.z,
        end.position.x,end.position.y,end.position.z
      ]);
      line.object.computeLineDistances();
      line.object.material.linewidth = thicknessToPixels(line.thickness || 2);
      line.object.material.resolution.set(window.innerWidth, window.innerHeight);
      line.object.material.needsUpdate = true;

      if (line.label) {
        line.label.position.copy(start.position).add(end.position).multiplyScalar(.5);
        line.label.position.y += .04;

        const fresh = makeTextSprite(`${line.name} · ${formatDistance(line.distance)}`);
        if (line.label.material?.map) line.label.material.map.dispose();
        line.label.material.dispose();
        line.label.material = fresh.material;
        line.label.userData.baseScale = fresh.userData.baseScale;
        line.label.visible = defaultLabels.checked && line.visible !== false;
      }
    }

    function createPermanentLine(startPoint, endPoint) {
      const thickness = Number(defaultThickness.value) || 2;
      const object = makeTechnicalLine(startPoint.position, endPoint.position, thickness, 0xffffff);
      const distance = startPoint.position.distanceTo(endPoint.position);
      const name = `${startPoint.name}${endPoint.name}`;
      const label = makeTextSprite(`${name} · ${formatDistance(distance)}`);
      label.position.copy(startPoint.position).add(endPoint.position).multiplyScalar(0.5);
      label.position.y += 0.055;
      scene.add(label);

      const line = {
        id: `l${Date.now()}_${Math.random().toString(36).slice(2,7)}`,
        name,
        startId: startPoint.id,
        endId: endPoint.id,
        distance,
        object,
        label,
        thickness,
        color: 0xffffff,
        visible: true,
        index: nextLineIndex++
      };

      lines.push(line);
      updateGeometryUI();
      return line;
    }

    function deleteLineById(id) {
      const idx = lines.findIndex(l => l.id === id);
      if (idx < 0) return;

      const line = lines[idx];
      disposeObject(line.object);
      if (line.label) {
        if (line.label.material?.map) line.label.material.map.dispose();
        disposeObject(line.label);
      }
      lines.splice(idx, 1);
      if (selectedLineId === id) {
        selectedLineId = null;
        lineEditor.classList.remove('open');
      }
      updateGeometryUI();
    }

    function deletePointById(id) {
      // Verwijder eerst alle lijnen die aan dit punt hangen
      const linked = lines.filter(l => l.startId === id || l.endId === id).map(l => l.id);
      linked.forEach(deleteLineById);

      const idx = points.findIndex(p => p.id === id);
      if (idx < 0) return;

      const point = points[idx];
      disposeObject(point.marker);
      points.splice(idx, 1);

      if (activeStartPointId === id) activeStartPointId = null;
      updateGeometryUI();
    }

    function clearAllGeometry() {
      lines.forEach(l => {
        disposeObject(l.object);
        if (l.label) {
          if (l.label.material?.map) l.label.material.map.dispose();
          disposeObject(l.label);
        }
      });
      points.forEach(p => disposeObject(p.marker));
      lines.length = 0;
      points.length = 0;
      nextPointIndex = 0;
      nextLineIndex = 1;
      activeStartPointId = null;
      selectedLineId = null;
      undoStack.length = 0;
      lineEditor.classList.remove('open');
      clearMeasurement();
      updateGeometryUI();
    }

    function updateGeometryUI() {
      if (geometryPanel) geometryPanel.classList.remove('visible');
      updateCameraMenuLabel();

      if (!menuObjects) return;
      menuObjects.innerHTML = '';

      if (points.length === 0 && lines.length === 0) {
        menuObjects.innerHTML = '<div class="menuObjectRow"><span>Nog geen objecten</span></div>';
        return;
      }

      for (const line of lines) {
        const row = document.createElement('div');
        row.className = 'menuObjectRow';

        const select = document.createElement('button');
        select.type = 'button';
        select.textContent = `${line.name} · ${formatDistance(line.distance)}`;
        select.addEventListener('click', () => selectLine(line.id));

        const del = document.createElement('button');
        del.type = 'button';
        del.textContent = 'Wis';
        del.addEventListener('click', () => deleteLineById(line.id));

        row.append(select, del);
        menuObjects.appendChild(row);
      }

      for (const point of points) {
        const row = document.createElement('div');
        row.className = 'menuObjectRow';

        const use = document.createElement('button');
        use.type = 'button';
        use.textContent = `Punt ${point.name}${activeStartPointId === point.id ? ' · actief' : ''}`;
        use.addEventListener('click', () => {
          setActiveStartPoint(point.id);
          closeCameraMenu();
        });

        row.appendChild(use);
        menuObjects.appendChild(row);
      }
    }

    function getLineById(id) {
      return lines.find(l => l.id === id) || null;
    }

    function selectLine(id) {
      const line = getLineById(id);
      selectedLineId = line ? id : null;

      for (const l of lines) {
        if (l.object?.material) {
          l.object.material.opacity = l.id === id ? 1 : .55;
          l.object.material.needsUpdate = true;
        }
      }

      if (!line) {
        lineEditor.classList.remove('open');
        return;
      }

      lineEditor.classList.add('open');
      lineEditorName.textContent = `${line.name} · ${formatDistance(line.distance)}`;
      lineLengthInput.value = line.distance.toFixed(3);
      lineThicknessSelect.value = String(line.thickness || 2);
    }

    function endpointHasOtherConnections(pointId, excludingLineId) {
      return lines.some(l =>
        l.id !== excludingLineId &&
        (l.startId === pointId || l.endId === pointId)
      );
    }

    function pushUndo(action) {
      undoStack.push(action);
      if (undoStack.length > 20) undoStack.shift();
    }

    function applySelectedLineLength() {
      const line = getLineById(selectedLineId);
      if (!line) return;

      const newLength = Number(lineLengthInput.value);
      if (!Number.isFinite(newLength) || newLength <= 0) return;

      const start = getPointById(line.startId);
      const end = getPointById(line.endId);
      if (!start || !end) return;

      if (endpointHasOtherConnections(end.id, line.id)) {
        stageEl.textContent = 'Wijziging geblokkeerd';
        hintEl.textContent = `Punt ${end.name} is verbonden met andere geometrie.`;
        closeCameraMenu();
        return;
      }

      const oldEnd = end.position.clone();
      const dir = end.position.clone().sub(start.position);
      if (dir.lengthSq() < 1e-8) return;
      dir.normalize();

      end.position.copy(start.position).add(dir.multiplyScalar(newLength));
      end.marker.position.copy(end.position);

      pushUndo({
        type:'lineLength',
        lineId:line.id,
        endPointId:end.id,
        oldEnd:oldEnd.toArray()
      });

      refreshLineGeometry(line);
      selectLine(line.id);
      updateGeometryUI();
      stageEl.textContent = 'Lijn aangepast';
      hintEl.textContent = `${line.name} = ${formatDistance(line.distance)} vanaf ${start.name}.`;
      closeCameraMenu();
    }

    function undoLastAction() {
      const action = undoStack.pop();
      if (!action) {
        stageEl.textContent = 'Niets om ongedaan te maken';
        closeCameraMenu();
        return;
      }

      if (action.type === 'lineLength') {
        const line = getLineById(action.lineId);
        const end = getPointById(action.endPointId);
        if (line && end) {
          end.position.fromArray(action.oldEnd);
          end.marker.position.copy(end.position);
          refreshLineGeometry(line);
        }
      } else if (action.type === 'createdLine') {
        deleteLineById(action.lineId);
        if (action.endPointId) deletePointById(action.endPointId);
      }

      updateGeometryUI();
      stageEl.textContent = 'Ongedaan gemaakt';
      closeCameraMenu();
    }

    function setActiveStartPoint(pointId) {
      activeStartPointId = pointId;
      const p = getPointById(pointId);

      if (!p) {
        activeStartPointId = null;
        return;
      }

      pointA = p.position.clone();
      markerA = p.marker;
      pointB = null;
      markerB = null;
      directionPoint = null;
      measureLine = null;
      normalAtA = upAxis.clone();

      resetStabilitySamples();
      stageEl.textContent = mode === 'measure' ? `Vanaf ${p.name}: kies eindpunt` : `Vanaf ${p.name}: kies richting`;
      hintEl.textContent = mode === 'measure'
        ? 'Richt op het volgende punt en druk op de meetknop.'
        : 'Richt in de gewenste richting en druk op de meetknop.';
      updateGeometryUI();
    }


    function stakeFromLastPointInAR() {
      if (points.length === 0) {
        stageEl.textContent = 'Nog geen startpunt';
        hintEl.textContent = 'Teken eerst minstens één punt of lijn.';
        closeCameraMenu();
        return;
      }

      const raw = Number(menuDistanceInput.value);
      if (!Number.isFinite(raw) || raw <= 0) {
        stageEl.textContent = 'Ongeldige afstand';
        hintEl.textContent = 'Geef in het cameramenu een afstand groter dan nul.';
        return;
      }

      targetMeters = menuUnitSelect.value === 'cm' ? raw / 100 : raw;
      directionMode = menuDirectionSelect.value;
      mode = 'stake';

      clearMeasurement();
      setActiveStartPoint(points[points.length - 1].id);

      distanceEl.textContent = formatDistance(targetMeters);
      detailEl.textContent =
        directionMode === 'horizontal' ? 'Horizontaal uitzetten' :
        directionMode === 'surface' ? 'Op oppervlak uitzetten' :
        'Vrij 3D uitzetten';

      stageEl.textContent = `Nieuwe lijn vanaf ${points[points.length - 1].name}`;
      hintEl.textContent = `Richt de gewenste richting aan. Berekende afstand: ${formatDistance(targetMeters)}.`;
      closeCameraMenu();
    }

    function startNewLine(useLastPoint = false) {
      clearMeasurement();

      if (useLastPoint && points.length > 0) {
        setActiveStartPoint(points[points.length - 1].id);
      } else {
        activeStartPointId = null;
        stageEl.textContent = reticle?.visible ? 'Nieuw startpunt' : 'Zoek een oppervlak';
        hintEl.textContent = 'Plaats het startpunt van de nieuwe lijn.';
      }

      closeCameraMenu();
    }

    function resetStabilitySamples() {
      sampleHistory.length = 0;
      stabilityMeters = null;
      stabilityClass = 'unknown';
      updateStabilityUI();
    }

    function addTargetSample(point, source) {
      if (!point) return;

      // Meng geen fysieke en virtuele samples door elkaar.
      const last = sampleHistory[sampleHistory.length - 1];
      if (last && last.source !== source) {
        sampleHistory.length = 0;
      }

      sampleHistory.push({
        point: point.clone(),
        source,
        time: performance.now()
      });

      if (sampleHistory.length > MAX_SAMPLES) {
        sampleHistory.shift();
      }

      calculateStability();
    }

    function calculateStability() {
      if (sampleHistory.length < 2) {
        stabilityMeters = null;
        stabilityClass = 'unknown';
        updateStabilityUI();
        return;
      }

      const mean = new THREE.Vector3();
      for (const s of sampleHistory) mean.add(s.point);
      mean.multiplyScalar(1 / sampleHistory.length);

      let sumSq = 0;
      for (const s of sampleHistory) {
        sumSq += s.point.distanceToSquared(mean);
      }

      stabilityMeters = Math.sqrt(sumSq / sampleHistory.length);

      if (stabilityMeters <= 0.008) {
        stabilityClass = 'good';
      } else if (stabilityMeters <= 0.025) {
        stabilityClass = 'medium';
      } else {
        stabilityClass = 'poor';
      }

      updateStabilityUI();
    }

    function updateStabilityUI() {
      stabilityEl.classList.remove('good', 'medium', 'poor');

      if (stabilityMeters === null) {
        stabilityEl.textContent = 'Stabiliteit: meten…';
        return;
      }

      const cm = stabilityMeters * 100;
      const label =
        stabilityClass === 'good' ? 'goed' :
        stabilityClass === 'medium' ? 'redelijk' :
        'onrustig';

      stabilityEl.textContent = `Stabiliteit: ${label} · jitter ±${cm.toFixed(1)} cm`;
      stabilityEl.classList.add(stabilityClass);
    }

    function getFilteredTargetPoint() {
      if (!currentTargetPoint) return null;

      if (sampleHistory.length < MIN_CAPTURE_SAMPLES) {
        return currentTargetPoint.clone();
      }

      // Robuust gemiddelde: verwijder de 20% verste samples t.o.v. het eerste gemiddelde.
      const mean = new THREE.Vector3();
      for (const s of sampleHistory) mean.add(s.point);
      mean.multiplyScalar(1 / sampleHistory.length);

      const sorted = sampleHistory
        .map(s => ({ point: s.point, d: s.point.distanceTo(mean) }))
        .sort((a, b) => a.d - b.d);

      const keepCount = Math.max(MIN_CAPTURE_SAMPLES, Math.ceil(sorted.length * 0.8));
      const filtered = new THREE.Vector3();

      for (let i = 0; i < keepCount; i++) filtered.add(sorted[i].point);
      filtered.multiplyScalar(1 / keepCount);

      return filtered;
    }

    function disposeObject(obj) {
      if (!obj) return;
      scene.remove(obj);
      obj.traverse?.((child) => {
        child.geometry?.dispose?.();
        child.material?.dispose?.();
      });
    }

    function makeMarker(colorHex, size = 1) {
      const group = new THREE.Group();

      const sphere = new THREE.Mesh(
        new THREE.SphereGeometry(0.012 * size, 24, 16),
        new THREE.MeshBasicMaterial({ color: colorHex })
      );
      group.add(sphere);

      const ring = new THREE.Mesh(
        new THREE.RingGeometry(0.018 * size, 0.024 * size, 40),
        new THREE.MeshBasicMaterial({ color: colorHex, side: THREE.DoubleSide })
      );
      ring.rotation.x = -Math.PI / 2;
      group.add(ring);

      group.userData.baseSize = size;
      scene.add(group);
      return group;
    }

    function updateMarkerScale(marker) {
      if (!marker || !renderer) return;

      const xrCamera = renderer.xr.getCamera(camera);
      xrCamera.getWorldPosition(cameraPos);
      const d = Math.max(0.05, marker.position.distanceTo(cameraPos));

      // Sterkere afstandsafhankelijke schaal: precies dichtbij, opvallend op afstand.
      const scale = Math.min(5.0, Math.max(0.55, 0.48 + d * 0.34));
      marker.scale.setScalar(scale);
    }

    function updateLineVisuals() {
      for (const line of lines) {
        if (line.object?.material?.resolution) {
          line.object.material.resolution.set(window.innerWidth, window.innerHeight);
        }

        if (line.label) {
          line.label.visible = defaultLabels.checked && line.visible !== false;

          const start = getPointById(line.startId);
          const end = getPointById(line.endId);
          if (!start || !end) continue;

          const mid = start.position.clone().add(end.position).multiplyScalar(.5);
          const xrCamera = renderer.xr.getCamera(camera);
          xrCamera.getWorldPosition(cameraPos);
          const d = Math.max(.2, mid.distanceTo(cameraPos));
          const s = Math.min(2.2, Math.max(.7, .72 + d * .09));
          const base = line.label.userData.baseScale || new THREE.Vector3(.72,.18,1);
          line.label.scale.set(base.x*s, base.y*s, 1);
        }
      }
    }

    function updateAllMarkerScales() {
      for (const p of points) updateMarkerScale(p.marker);
      updateMarkerScale(directionMarker);
      updateLineVisuals();
    }

    function drawLine(a, b) {
      if (measureLine) disposeObject(measureLine);
      const geometry = new THREE.BufferGeometry().setFromPoints([a, b]);
      const material = new THREE.LineBasicMaterial({ color: 0xffffff });
      measureLine = new THREE.Line(geometry, material);
      scene.add(measureLine);
    }

    function clearMeasurement() {
      pointA = null;
      pointB = null;
      directionPoint = null;
      normalAtA = null;
      activeStartPointId = null;

      // Alleen tijdelijke objecten opruimen.
      if (directionMarker) {
        disposeObject(directionMarker);
        directionMarker = null;
      }
      if (measureLine) {
        disposeObject(measureLine);
        measureLine = null;
      }

      markerA = null;
      markerB = null;

      distanceEl.textContent = '—';
      detailEl.textContent = '';
      stageEl.textContent = reticle?.visible ? 'Punt A' : 'Zoek een oppervlak';
      hintEl.textContent = reticle?.visible
        ? 'Richt het kruis op punt A en druk op de meetknop.'
        : 'Beweeg rustig zodat ARCore het oppervlak kan herkennen.';
      captureBtn.disabled = !reticle?.visible;
      targetSource = reticle?.visible ? 'hit' : 'none';
      currentTargetPoint = reticle?.visible ? getReticlePosition() : null;
      resetStabilitySamples();
      updateGeometryUI();
    }

    function getReticlePosition() {
      tmpPos.setFromMatrixPosition(reticle.matrix);
      return tmpPos.clone();
    }

    function getReticleNormal() {
      tmpQuat.setFromRotationMatrix(reticle.matrix);
      return upAxis.clone().applyQuaternion(tmpQuat).normalize();
    }

    function getCameraRay() {
      const xrCamera = renderer.xr.getCamera(camera);
      xrCamera.getWorldPosition(cameraPos);
      xrCamera.getWorldQuaternion(cameraQuat);
      cameraForward.set(0, 0, -1).applyQuaternion(cameraQuat).normalize();
      return {
        origin: cameraPos.clone(),
        direction: cameraForward.clone()
      };
    }

    function intersectRayWithPlane(origin, direction, planePoint, planeNormal) {
      const denom = planeNormal.dot(direction);
      if (Math.abs(denom) < 0.015) return null;

      const t = planeNormal.dot(planePoint.clone().sub(origin)) / denom;
      if (t <= 0) return null;

      const p = origin.clone().add(direction.clone().multiplyScalar(t));
      if (p.distanceTo(origin) > MAX_VIRTUAL_RANGE) return null;
      if (pointA && p.distanceTo(pointA) > MAX_VIRTUAL_RANGE) return null;
      return p;
    }

    function getVirtualTarget() {
      if (!pointA) return null;
      const ray = getCameraRay();

      if (mode === 'stake' && !pointB) {
        let dir = ray.direction.clone();

        if (directionMode === 'horizontal') {
          dir.y = 0;
        } else if (directionMode === 'surface') {
          const n = (normalAtA || upAxis).clone().normalize();
          dir.sub(n.multiplyScalar(dir.dot(n)));
        }

        if (dir.lengthSq() < 0.000001) return null;
        dir.normalize();
        return pointA.clone().add(dir.multiplyScalar(Math.min(Math.max(targetMeters, 2), 8)));
      }

      if (mode === 'measure' && !pointB) {
        const n = (normalAtA || upAxis).clone().normalize();
        return intersectRayWithPlane(ray.origin, ray.direction, pointA, n);
      }

      if (mode === 'stake' && pointB) {
        const n = directionMode === 'horizontal'
          ? upAxis.clone()
          : (normalAtA || upAxis).clone().normalize();
        return intersectRayWithPlane(ray.origin, ray.direction, pointA, n);
      }

      return null;
    }

    function setReticleToVirtualPoint(point) {
      reticle.visible = true;
      reticle.matrix.identity();
      reticle.matrix.setPosition(point);
    }

    function updateAimState(source) {
      aimEl.classList.remove('ready', 'virtual');
      if (source === 'hit') {
        aimEl.classList.add('ready');
      } else if (source === 'virtual') {
        aimEl.classList.add('virtual');
      }
    }

    function computeAutomaticB() {
      if (!pointA || !directionPoint) return null;

      let dir = directionPoint.clone().sub(pointA);

      if (directionMode === 'horizontal') {
        dir.y = 0;
      } else if (directionMode === 'surface') {
        const n = (normalAtA || upAxis).clone().normalize();
        dir.sub(n.multiplyScalar(dir.dot(n)));
      }

      if (dir.lengthSq() < 0.000001) return null;

      dir.normalize();
      return pointA.clone().add(dir.multiplyScalar(targetMeters));
    }

    function placeCurrentPoint() {
      if (!currentTargetPoint) return;

      const current = getFilteredTargetPoint();
      if (!current) return;

      if (mode === 'measure') {
        if (!pointA) {
          const startPoint = createPermanentPoint(current, 0x69ff9a);
          activeStartPointId = startPoint.id;

          pointA = startPoint.position.clone();
          markerA = startPoint.marker;
          normalAtA = targetSource === 'hit' ? getReticleNormal() : upAxis.clone();

          resetStabilitySamples();
          stageEl.textContent = `Vanaf ${startPoint.name}: kies eindpunt`;
          hintEl.textContent = 'Richt op het volgende punt en druk opnieuw.';
          updateGeometryUI();
        } else if (!pointB) {
          const startPoint = getPointById(activeStartPointId);
          if (!startPoint) return;

          const endPoint = createPermanentPoint(current, 0xffd166);
          pointB = endPoint.position.clone();
          markerB = endPoint.marker;

          const line = createPermanentLine(startPoint, endPoint);
          pushUndo({type:'createdLine', lineId:line.id, endPointId:endPoint.id});

          distanceEl.textContent = formatDistance(line.distance);
          detailEl.textContent = `Lijn ${line.name} opgeslagen`;
          stageEl.textContent = 'Lijn voltooid';
          hintEl.textContent = 'Open ☰ voor een nieuwe lijn of start vanaf het laatste punt.';
          captureBtn.disabled = true;
          stabilityEl.textContent = 'Punten gefilterd uit recente AR-samples';
          updateGeometryUI();
        }
        return;
      }

      // Uitzetten
      if (!pointA) {
        const startPoint = createPermanentPoint(current, 0x69ff9a);
        activeStartPointId = startPoint.id;

        pointA = startPoint.position.clone();
        markerA = startPoint.marker;
        normalAtA = targetSource === 'hit' ? getReticleNormal() : upAxis.clone();

        resetStabilitySamples();
        stageEl.textContent = 'Kies richting';
        distanceEl.textContent = formatDistance(targetMeters);
        detailEl.textContent = `Vanaf ${startPoint.name} · doelafstand`;
        hintEl.textContent = 'Richt nu in de gewenste richting en druk opnieuw. De afstand tot het richtpunt maakt niet uit.';
        updateGeometryUI();
      } else if (!directionPoint && !pointB) {
        const startPoint = getPointById(activeStartPointId);
        if (!startPoint) return;

        directionPoint = current;

        const b = computeAutomaticB();
        if (!b) {
          directionPoint = null;
          stageEl.textContent = 'Richting ongeldig';
          hintEl.textContent = 'Richt duidelijk weg van het startpunt en probeer opnieuw.';
          return;
        }

        const endPoint = createPermanentPoint(b, 0xffd166);
        pointB = endPoint.position.clone();
        markerB = endPoint.marker;

        directionMarker = makeMarker(0x7ab7ff, 0.65);
        directionMarker.position.copy(directionPoint);

        const line = createPermanentLine(startPoint, endPoint);
        pushUndo({type:'createdLine', lineId:line.id, endPointId:endPoint.id});

        distanceEl.textContent = formatDistance(line.distance);
        detailEl.textContent =
          directionMode === 'free3d' ? `${line.name} · Vrij 3D` :
          directionMode === 'horizontal' ? `${line.name} · Horizontaal` :
          `${line.name} · Op oppervlak`;

        stageEl.textContent = 'Punt automatisch geplaatst';
        hintEl.textContent = 'De lijn blijft staan. Open ☰ voor de volgende lijn.';
        captureBtn.disabled = true;
        stabilityEl.textContent = 'Richting gefilterd uit recente AR-samples';
        updateGeometryUI();
      }
    }

    function initThree() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera();

      renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      renderer.xr.setReferenceSpaceType('local');
      renderer.domElement.style.display = 'none';
      renderer.domElement.style.pointerEvents = 'none';
      document.body.appendChild(renderer.domElement);

      reticle = new THREE.Mesh(
        new THREE.RingGeometry(0.035, 0.045, 40).rotateX(-Math.PI / 2),
        new THREE.MeshBasicMaterial({ color: 0x69ff9a })
      );
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);
    }


    function cleanupARSession() {
      try {
        if (renderer) {
          renderer.setAnimationLoop(null);

          // Belangrijk: de WebGL-canvas blijft anders als een onzichtbare,
          // full-screen laag boven het beginscherm liggen en blokkeert klikken.
          if (renderer.domElement) {
            renderer.domElement.style.display = 'none';
            renderer.domElement.style.pointerEvents = 'none';
          }
        }
      } catch (_) {}

      hitTestSource = null;
      hitTestSourceRequested = false;
      xrSession = null;
      currentTargetPoint = null;
      targetSource = 'none';

      if (reticle) reticle.visible = false;
      updateAimState('none');
      clearMeasurement();

      // Permanente geometrie is voorlopig alleen geldig binnen dezelfde XR-sessie.
      // Projectopslag/herpositionering komt in een latere fase.
      lines.forEach(l => {
        disposeObject(l.object);
        if (l.label) {
          if (l.label.material?.map) l.label.material.map.dispose();
          disposeObject(l.label);
        }
      });
      points.forEach(p => disposeObject(p.marker));
      lines.length = 0;
      points.length = 0;
      nextPointIndex = 0;
      nextLineIndex = 1;
      activeStartPointId = null;
      updateGeometryUI();

      closeCameraMenu();
      overlay.style.display = 'none';
      app.style.display = 'grid';
    }

    async function exitAR() {
      const session = xrSession || renderer?.xr?.getSession?.();

      if (session) {
        try {
          await session.end();
          return; // cleanup gebeurt via het 'end'-event
        } catch (_) {
          cleanupARSession();
          return;
        }
      }

      cleanupARSession();
    }

    async function checkSupport() {
      if (!navigator.xr) {
        startBtn.disabled = true;
        showError('Deze browser biedt geen WebXR. Open deze pagina in Chrome op een ARCore-compatibele Android-telefoon.');
        return;
      }

      try {
        const ok = await navigator.xr.isSessionSupported('immersive-ar');
        if (!ok) {
          startBtn.disabled = true;
          showError('Immersive AR is niet beschikbaar op dit toestel of in deze browser.');
        }
      } catch (err) {
        startBtn.disabled = true;
        showError(`WebXR-test mislukt: ${err.message}`);
      }
    }

    async function startAR() {
      errorBox.style.display = 'none';
      mode = 'measure';
      directionMode = 'horizontal';

      if (mode === 'stake') {
        const parsed = readTargetMeters();
        if (parsed === null) {
          showError('Geef eerst een geldige gewenste afstand in.');
          return;
        }
        targetMeters = parsed;
      }

      try {
        if (!renderer) initThree();

        // De canvas wordt bij het verlaten van AR verborgen zodat hij het
        // beginscherm niet blokkeert. Voor een nieuwe sessie zetten we hem terug aan.
        if (renderer.domElement) {
          renderer.domElement.style.display = 'block';
          renderer.domElement.style.pointerEvents = 'auto';
        }

        const sessionInit = {
          requiredFeatures: ['hit-test'],
          optionalFeatures: ['dom-overlay'],
          domOverlay: { root: document.body }
        };

        xrSession = await navigator.xr.requestSession('immersive-ar', sessionInit);
        await renderer.xr.setSession(xrSession);

        app.style.display = 'none';
        overlay.style.display = 'block';
        closeCameraMenu();
        updateCameraMenuLabel();

        xrSession.addEventListener('end', () => {
          cleanupARSession();
        }, { once: true });

        clearMeasurement();
        renderer.setAnimationLoop(render);
      } catch (err) {
        if (renderer?.domElement) {
          renderer.domElement.style.display = 'none';
          renderer.domElement.style.pointerEvents = 'none';
        }
        showError(`AR kon niet starten: ${err.message}\n\nControleer of Chrome cameratoegang heeft en Google Play-services voor AR geïnstalleerd zijn.`);
      }
    }

    function render(timestamp, frame) {
      if (!frame) return;

      const referenceSpace = renderer.xr.getReferenceSpace();
      const session = renderer.xr.getSession();

      if (!hitTestSourceRequested) {
        session.requestReferenceSpace('viewer').then((viewerSpace) => {
          session.requestHitTestSource({ space: viewerSpace }).then((source) => {
            hitTestSource = source;
          });
        });

        session.addEventListener('end', () => {
          hitTestSourceRequested = false;
          hitTestSource = null;
        });

        hitTestSourceRequested = true;
      }

      let physicalHitPoint = null;
      let physicalPose = null;

      if (hitTestSource) {
        const results = frame.getHitTestResults(hitTestSource);

        if (results.length > 0) {
          const hit = results[0];
          const pose = hit.getPose(referenceSpace);

          if (pose) {
            physicalPose = pose;
            tmpPos.set(
              pose.transform.position.x,
              pose.transform.position.y,
              pose.transform.position.z
            );
            physicalHitPoint = tmpPos.clone();
          }
        }
      }

      if (!pointA) {
        if (physicalPose && physicalHitPoint) {
          reticle.visible = true;
          reticle.matrix.fromArray(physicalPose.transform.matrix);
          targetSource = 'hit';
          currentTargetPoint = physicalHitPoint;
          addTargetSample(currentTargetPoint, 'hit');
          updateAimState('hit');
          captureBtn.disabled = false;

          stageEl.textContent = 'Punt A';
          detailEl.textContent = 'Groen = echt AR-oppervlak';
          hintEl.textContent = stabilityClass === 'poor' ? 'Houd de telefoon even stiller voor een stabieler punt A.' : 'Richt het groene kruis op punt A en druk op de meetknop.';
        } else {
          reticle.visible = false;
          if (targetSource !== 'none') resetStabilitySamples();
          targetSource = 'none';
          currentTargetPoint = null;
          updateAimState('none');
          captureBtn.disabled = true;

          stageEl.textContent = 'Zoek een oppervlak';
          detailEl.textContent = '';
          hintEl.textContent = 'Beweeg rustig zodat ARCore rond punt A een oppervlak kan herkennen.';
        }

        updateAllMarkerScales();
        updateAllMarkerScales();
        renderer.render(scene, camera);
        return;
      }

      if (!pointB) {
        if (physicalPose && physicalHitPoint) {
          reticle.visible = true;
          reticle.matrix.fromArray(physicalPose.transform.matrix);
          targetSource = 'hit';
          currentTargetPoint = physicalHitPoint;
          addTargetSample(currentTargetPoint, 'hit');
          updateAimState('hit');
          captureBtn.disabled = false;

          if (mode === 'measure') {
            stageEl.textContent = 'Punt B';
            detailEl.textContent = 'Groen = echt AR-oppervlak';
            hintEl.textContent = stabilityClass === 'poor' ? 'Houd even stil zodat punt B stabiliseert.' : 'Richt op punt B en druk op de meetknop.';
          } else {
            stageEl.textContent = 'Kies richting';
            detailEl.textContent = 'Groen = richting via echt oppervlak';
            hintEl.textContent = 'Richt in de gewenste richting. De afstand tot het richtpunt maakt niet uit.';
          }
        } else {
          const fallback = getVirtualTarget();

          if (fallback) {
            setReticleToVirtualPoint(fallback);
            targetSource = 'virtual';
            currentTargetPoint = fallback.clone();
            addTargetSample(currentTargetPoint, 'virtual');
            updateAimState('virtual');
            captureBtn.disabled = false;

            if (mode === 'measure') {
              stageEl.textContent = 'Punt B · verlengd bereik';
              detailEl.textContent = 'Geel = geprojecteerd op vlak van A';
              hintEl.textContent = 'Geen oppervlak gedetecteerd; B wordt berekend op hetzelfde vlak als A.';
            } else {
              stageEl.textContent = 'Kies richting · verlengd bereik';
              detailEl.textContent = 'Geel = richting uit camerastand';
              hintEl.textContent = 'Geen oppervlak nodig: richt alleen in de gewenste richting en druk op de meetknop.';
            }
          } else {
            reticle.visible = false;
            targetSource = 'none';
            currentTargetPoint = null;
            updateAimState('none');
            captureBtn.disabled = true;

            stageEl.textContent = 'Richting niet bruikbaar';
            detailEl.textContent = 'Wit = geen geldig richtpunt';
            hintEl.textContent = 'Draai of kantel de telefoon iets zodat de richting het referentievlak kruist.';
          }
        }

        updateAllMarkerScales();
        updateAllMarkerScales();
        renderer.render(scene, camera);
        return;
      }

      if (mode === 'stake' && pointB) {
        let here = null;

        if (physicalPose && physicalHitPoint) {
          reticle.visible = true;
          reticle.matrix.fromArray(physicalPose.transform.matrix);
          here = physicalHitPoint;
          targetSource = 'hit';
          updateAimState('hit');
        } else {
          const fallback = getVirtualTarget();
          if (fallback) {
            setReticleToVirtualPoint(fallback);
            here = fallback;
            targetSource = 'virtual';
            updateAimState('virtual');
          } else {
            reticle.visible = false;
            targetSource = 'none';
            updateAimState('none');
          }
        }

        currentTargetPoint = here ? here.clone() : null;
        captureBtn.disabled = true;

        if (here) {
          const remaining = here.distanceTo(pointB);
          distanceEl.textContent = formatDistance(pointA.distanceTo(pointB));
          detailEl.textContent = `Richtpunt → B: ${formatDistance(remaining)} · ${targetSource === 'hit' ? 'groen' : 'geel'}`;

          if (remaining < 0.05) {
            stageEl.textContent = 'Je zit op punt B';
            hintEl.textContent = 'Het richtpunt ligt binnen 5 cm van het berekende punt B.';
          } else {
            stageEl.textContent = 'Zoek punt B';
            hintEl.textContent = 'Beweeg het richtpunt naar de virtuele marker B.';
          }
        }
      } else {
        reticle.visible = false;
        currentTargetPoint = null;
        updateAimState('none');
        captureBtn.disabled = true;
      }

      updateAllMarkerScales();
      renderer.render(scene, camera);
    }

    startBtn.addEventListener('click', startAR);

    settingsBtn.addEventListener('click', () => {
      settingsPanel.classList.toggle('open');
    });

    cameraMenuBtn.addEventListener('click', () => {
      cameraMenuPanel.classList.contains('open') ? closeCameraMenu() : openCameraMenu();
    });

    menuCloseBtn.addEventListener('click', closeCameraMenu);

    menuModeMeasureBtn.addEventListener('click', () => {
      mode = 'measure';
      clearMeasurement();
      stageEl.textContent = 'Meten';
      hintEl.textContent = 'Plaats punt A en daarna punt B.';
      closeCameraMenu();
    });

    menuModeStakeBtn.addEventListener('click', () => {
      const raw = Number(menuDistanceInput.value);
      if (Number.isFinite(raw) && raw > 0) {
        targetMeters = menuUnitSelect.value === 'cm' ? raw / 100 : raw;
      }
      directionMode = menuDirectionSelect.value;
      mode = 'stake';
      clearMeasurement();
      stageEl.textContent = 'Uitzetten';
      hintEl.textContent = 'Plaats punt A en kies daarna de richting.';
      closeCameraMenu();
    });

    menuNewLineBtn.addEventListener('click', () => startNewLine(false));
    menuUseLastPointBtn.addEventListener('click', () => startNewLine(true));
    menuStakeFromLastBtn.addEventListener('click', stakeFromLastPointInAR);

    menuObjectsBtn.addEventListener('click', () => {
      const open = menuObjects.classList.toggle('open');
      menuObjectsBtn.textContent = open ? 'Objecten verbergen' : 'Objecten';
      updateGeometryUI();
    });

    applyLineLengthBtn.addEventListener('click', applySelectedLineLength);

    lineThicknessSelect.addEventListener('change', () => {
      const line = getLineById(selectedLineId);
      if (!line) return;
      line.thickness = Number(lineThicknessSelect.value) || 2;
      refreshLineGeometry(line);
      updateGeometryUI();
    });

    undoBtn.addEventListener('click', undoLastAction);

    menuClearAllBtn.addEventListener('click', () => {
      clearAllGeometry();
      closeCameraMenu();
    });

    menuBackBtn.addEventListener('click', async () => {
      closeCameraMenu();
      await exitAR();
    });

    captureBtn.addEventListener('click', placeCurrentPoint);

    if (toggleGeometryListBtn) {
      toggleGeometryListBtn.addEventListener('click', () => {
        const open = geometryList.classList.toggle('open');
        toggleGeometryListBtn.textContent = open ? 'Objecten verbergen' : 'Objecten tonen';
      });
    }

    window.addEventListener('resize', () => {
      if (renderer) renderer.setSize(window.innerWidth, window.innerHeight);
      for (const line of lines) {
        if (line.object?.material?.resolution) {
          line.object.material.resolution.set(window.innerWidth, window.innerHeight);
        }
      }
    });

    // Android/Chrome kan een pagina via de back/recents-flow herstellen.
    // Zorg dat een achtergebleven XR-loop de startpagina niet blokkeert.
    window.addEventListener('pageshow', (event) => {
      if (event.persisted && !navigator.xr) {
        cleanupARSession();
      }
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && !renderer?.xr?.getSession?.() && overlay.style.display === 'block') {
        cleanupARSession();
      }
    });

    mode = 'measure';
    directionMode = 'horizontal';
    defaultUnit.value = 'm';
    defaultThickness.value = '2';
    defaultLabels.checked = true;
    updateGeometryUI();
    checkSupport();
  </script>
</body>
</html>
