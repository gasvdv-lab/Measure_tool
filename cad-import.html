<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#111111">
  <meta name="application-name" content="AR construct">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.webmanifest?v=0.8.36.4.1">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png?v=0.8.36.4.1">
  <script>try{document.documentElement.dataset.appTheme=localStorage.getItem("measurear.ui.theme.v1")||"technical-green"}catch{document.documentElement.dataset.appTheme="technical-green"}</script>
  <title>AR construct · CAD preview</title>
  <link rel="stylesheet" href="./css/app.css?v=0.8.36.4.1-20260830-pwa-version-sync-fix">
  <style>
    html,body{overflow:auto;min-height:100%;background:#111}
    #cadStandalone{min-height:100dvh;display:grid;place-items:center;padding:16px}
    .cadStandaloneCard{width:min(96vw,720px);padding:18px;border:1px solid #ffffff22;border-radius:22px;background:#191919;text-align:left}
    .cadStandaloneCard h1,.cadStandaloneCard .logo{text-align:center}.cadStandaloneCard button{width:100%;margin-top:8px}
    .cadStandaloneCard .status{background:transparent;padding:0;margin:12px 0;font-size:.9rem;line-height:1.45}
    .cadStandaloneCard .help{font-size:.75rem}.cadStandaloneCard .error{font-size:.75rem}
    #cadPreviewWrap{display:none;margin:12px 0;border:1px solid #ffffff22;border-radius:16px;overflow:hidden;background:#0b0d0c}
    #cadPreview{display:block;width:100%;height:min(52vh,430px);touch-action:none}
    .cadPreviewToolbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px}
    .cadPreviewToolbar button{margin:0!important;padding:9px 4px!important;font-size:.68rem!important}
    #cadStandaloneInfo{padding:10px 2px;line-height:1.5;white-space:pre-line}
    .cadActions{display:none}
  </style>
</head>
<body>
<main id="cadStandalone">
  <section class="cadStandaloneCard">
    <div class="logo">▱</div>
    <h1>CAD importeren</h1>
    <p id="cadStandaloneStatus" class="status">Kies eerst een GLB/glTF-bestand. Je krijgt een 3D-preview vóór het model aan AR construct wordt toegevoegd.</p>
    <button id="cadStandaloneChoose" class="primary">Bestand kiezen</button>
    <input id="cadStandaloneFile" type="file" accept=".glb,.gltf,model/gltf-binary,model/gltf+json" hidden>

    <div id="cadPreviewWrap">
      <canvas id="cadPreview"></canvas>
      <div class="cadPreviewToolbar">
        <button id="cadViewIso" class="secondary">3D</button>
        <button id="cadViewTop" class="secondary">Boven</button>
        <button id="cadViewFront" class="secondary">Voor</button>
        <button id="cadViewFit" class="secondary">Alles</button>
      </div>
    </div>

    <div id="cadStandaloneInfo" class="help"></div>
    <div id="cadPreviewActions" class="cadActions">
      <button id="cadStandaloneUse" class="primary">Model gebruiken</button>
      <button id="cadStandaloneReject" class="secondary">Ander bestand kiezen</button>
    </div>
    <button id="cadStandaloneReturn" class="primary" style="display:none">Terug naar Measure AR en plaatsen</button>
    <button id="cadStandaloneCancel" class="secondary">Annuleren en terug</button>
    <div id="cadStandaloneError" class="error"></div>
    <div class="build">v0.8.29.1 · CAD Preview</div>
  </section>
</main>
<script type="module" src="./js/cad-import-page.js?v=0.8.36.4.1-20260830-pwa-version-sync-fix"></script>
</body>
</html>
